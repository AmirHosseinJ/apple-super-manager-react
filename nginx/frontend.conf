# Apple Super Manager React frontend through Nginx without a domain.
#
# Deploy example:
#   sudo cp /srv/apple-super-manager/super-manager/nginx/frontend.conf /etc/nginx/conf.d/apple-super-manager-frontend.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Access example:
#   http://SERVER_IP:8088/
#
# Notes:
# - This listens on 8088 so it does not conflict with an existing site on 80/443.
# - Build the React/Vite app before using this config:
#     cd /srv/apple-super-manager/super-manager
#     npm ci
#     npm run build
# - The built app must exist at /srv/apple-super-manager/super-manager/build.
# - Open the firewall/security-group port: sudo ufw allow 8088/tcp
# - React SPA routes need the try_files fallback to /index.html.

server {
    listen 8088;
    server_name _;

    root /srv/apple-super-manager/super-manager/build;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
