# Apple Super Manager frontend HTTP config for first-time certificate issuance.
#
# Mount this into the Docker Nginx container before running Certbot:
#   /srv/apple-super-manager/super-manager/nginx/frontend.http.conf:/etc/nginx/conf.d/apple-super-manager-frontend-http.conf:ro
#
# This file intentionally does not redirect to HTTPS because the certificate may
# not exist yet. After the certificate is issued, you can keep this file mounted
# for ACME renewals and optionally change the / location to a HTTPS redirect.

server {
    listen 80;
    server_name manager.goldappleid.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "manager.goldappleid.ir HTTP challenge endpoint ready\n";
        add_header Content-Type text/plain;
    }
}
