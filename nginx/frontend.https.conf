# Apple Super Manager React frontend through the central Docker Nginx.
#
# Replace manager.goldappleid.ir with your real frontend subdomain.
# This config assumes appl_nginx, asm-frontend, and asm-keycloak share appl_network.
#
# Before enabling HTTPS, create DNS A record:
#   manager.goldappleid.ir -> SERVER_IP

server {
    listen 80;
    server_name manager.goldappleid.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name manager.goldappleid.ir;

    ssl_certificate /etc/letsencrypt/live/manager.goldappleid.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manager.goldappleid.ir/privkey.pem;

    location / {
        proxy_pass http://asm-frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
