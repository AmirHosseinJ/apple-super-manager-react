# Apple Super Manager React frontend HTTPS config through the central Docker Nginx.
#
# Mount this only after the certificate exists:
#   /srv/apple-super-manager/super-manager/nginx/frontend.https.conf:/etc/nginx/conf.d/apple-super-manager-frontend-https.conf:ro

server {
    listen 443 ssl;
    server_name manager.goldappleid.ir;

    ssl_certificate /etc/letsencrypt/live/manager.goldappleid.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manager.goldappleid.ir/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $frontend_upstream http://asm-frontend:80;
    set $apple_proxy_api_upstream https://goldappleid.ir;

    location ^~ /api/proxy-manager/ {
        proxy_pass $apple_proxy_api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host goldappleid.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
